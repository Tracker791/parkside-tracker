name: Weekly Spare Parts Scrape

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python scrape_spare_parts.py

      - name: Commit and push updated spare parts data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spare_parts.json
          git diff --staged --quiet || git commit -m "Weekly spare parts catalog refresh $(date -u +'%Y-%m-%d')"
          git push
