name: Weekly Store Locations Scrape

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scrape_stores.py

      - name: Commit and push updated store data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          git diff --staged --quiet || git commit -m "Weekly store locations refresh $(date -u +'%Y-%m-%d')"
          git push
